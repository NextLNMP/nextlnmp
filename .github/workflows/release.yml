name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Update version in install.sh
        run: |
          git checkout main
          sed -i 's/NEXTLNMP_VER=".*"/NEXTLNMP_VER="${{ steps.version.outputs.VERSION }}"/' install.sh
          sed -i "s/NEXTLNMP_Ver='[0-9.]*'/NEXTLNMP_Ver='${{ steps.version.outputs.VERSION }}'/" nextlnmp.sh

      - name: Create tarball
        run: |
          git stash
          git archive --format=tar.gz --prefix=nextlnmp-${{ steps.version.outputs.VERSION }}/ -o nextlnmp-${{ steps.version.outputs.VERSION }}.tar.gz main
          git stash pop || true

      - name: Calculate SHA256
        id: sha256
        run: |
          SHA=$(sha256sum nextlnmp-${{ steps.version.outputs.VERSION }}.tar.gz | awk '{print $1}')
          echo "SHA256=${SHA}" >> $GITHUB_OUTPUT
          echo "SHA256: ${SHA}"

      - name: Update SHA256 in install.sh
        run: |
          sed -i "s/TARBALL_SHA256=\".*\"/TARBALL_SHA256=\"${{ steps.sha256.outputs.SHA256 }}\"/" install.sh

      - name: Save CHANGELOG before cleanup
        run: |
          cp CHANGELOG_DRAFT.md /tmp/changelog-saved.md 2>/dev/null || echo "No CHANGELOG" > /tmp/changelog-saved.md

      - name: Update README
        run: |
          export VERSION=${{ steps.version.outputs.VERSION }}
          export DATE=$(date '+%Y-%m-%d')
          python3 tools/update_readme.py

      - name: Push all changes in one commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add install.sh nextlnmp.sh README.md CHANGELOG_DRAFT.md
          git diff --cached --quiet || git commit -m "chore: release v${{ steps.version.outputs.VERSION }} (version, SHA256, README) [skip release]"
          git push origin main

      - name: Generate release body
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          SHA=${{ steps.sha256.outputs.SHA256 }}
          CHANGELOG=$(cat /tmp/changelog-saved.md)
          cat > /tmp/release-body.md << BODYEOF
          ## ⚡ 一行安装

          bash <(curl -sL https://cnb.cool/NextLNMP/NextLNMP/-/git/raw/main/install.sh?download=true)

          ## 📦 SHA256

          ${SHA}  nextlnmp-${VERSION}.tar.gz

          ## 📋 更新内容

          ${CHANGELOG}

          ---
          官网：https://nextlnmp.cn · 镜像：https://cnb.cool/NextLNMP · QQ群：615298
          BODYEOF
          sed -i 's/^          //' /tmp/release-body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "NextLNMP v${{ steps.version.outputs.VERSION }}"
          body_path: /tmp/release-body.md
          files: nextlnmp-${{ steps.version.outputs.VERSION }}.tar.gz

      - name: Sync to CN repo (cnb.cool)
        # 国内引导走 cnb.cool 的 raw install.sh，发版后把 main 与 tag 推过去保持同代。
        # 未配置 CNB_TOKEN 时自动跳过，不阻断发版。
        continue-on-error: true
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: |
          if [ -z "${CNB_TOKEN}" ]; then
            echo "未配置 CNB_TOKEN，跳过国内仓库同步"; exit 0
          fi
          git remote add cnb "https://oauth2:${CNB_TOKEN}@cnb.cool/NextLNMP/NextLNMP.git" 2>/dev/null || true
          git push cnb HEAD:main
          git push cnb "v${{ steps.version.outputs.VERSION }}"
          echo "✓ 已同步到 cnb.cool"

      - name: Sync to CN repo (gitee)
        # 老流水线就有 gitee 同步，v2 重写时丢了（GITEE_TOKEN secret 一直在）。
        # gitee 私人令牌两种用户名格式都有人用，第一种不行自动换第二种。
        continue-on-error: true
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          if [ -z "${GITEE_TOKEN}" ]; then
            echo "未配置 GITEE_TOKEN，跳过 gitee 同步"; exit 0
          fi
          git remote add gitee "https://monetize:${GITEE_TOKEN}@gitee.com/palmmedia/nextlnmp.git" 2>/dev/null || true
          git push gitee HEAD:main 2>/dev/null || {
            git remote set-url gitee "https://monetize:${GITEE_TOKEN}@gitee.com/palmmedia/nextlnmp.git"
            git push gitee HEAD:main
          }
          git push gitee "v${{ steps.version.outputs.VERSION }}" || true
          echo "✓ 已同步到 gitee"

      - name: Sync to mirror server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 47.122.115.39
          username: root
          key: ${{ secrets.MIRROR_SSH_KEY }}
          script: |
            cd /data/mirror
            wget -q -O nextlnmp-${{ steps.version.outputs.VERSION }}.tar.gz https://github.com/NextLNMP/nextlnmp/releases/download/v${{ steps.version.outputs.VERSION }}/nextlnmp-${{ steps.version.outputs.VERSION }}.tar.gz
            wget -q -O install.sh.new https://raw.githubusercontent.com/NextLNMP/nextlnmp/main/install.sh && grep -q "NEXTLNMP_VER=\"${{ steps.version.outputs.VERSION }}\"" install.sh.new && mv install.sh.new install.sh && chmod 644 install.sh || rm -f install.sh.new
            echo "Mirror synced: nextlnmp-${{ steps.version.outputs.VERSION }}.tar.gz + install.sh"


