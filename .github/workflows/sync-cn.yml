name: Sync CN Mirrors

# 手动把 main + 指定 tag 推平到国内两个镜像仓（cnb.cool / gitee）。
# 平时不用跑——release.yml 发版时自动同步；这个入口给"镜像落后了要立刻拉齐"用。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: '要一并推过去的 tag（留空只推 main）'
        default: ''
      force:
        description: '强推（镜像历史被重写后对齐用）'
        type: boolean
        default: false''

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync gitee
        continue-on-error: true
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          [ -z "${GITEE_TOKEN}" ] && { echo "无 GITEE_TOKEN，跳过"; exit 0; }
          FLAG=""; [ "${{ inputs.force }}" = "true" ] && FLAG="--force"
          git remote add gitee "https://monetize:${GITEE_TOKEN}@gitee.com/palmmedia/nextlnmp.git"
          git push ${FLAG} gitee HEAD:main
          [ -n "${{ inputs.tag }}" ] && git push ${FLAG} gitee "${{ inputs.tag }}" || true

      - name: Sync gitcode
        continue-on-error: true
        env:
          GITCODE_USER: ${{ secrets.GITCODE_USER }}
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
        run: |
          { [ -z "${GITCODE_TOKEN}" ] || [ -z "${GITCODE_USER}" ]; } && { echo "无 GITCODE 凭据，跳过"; exit 0; }
          FLAG=""; [ "${{ inputs.force }}" = "true" ] && FLAG="--force"
          git remote add gitcode "https://${GITCODE_USER}:${GITCODE_TOKEN}@gitcode.com/palmmedia/nextlnmp.git"
          git push ${FLAG} gitcode HEAD:main
          [ -n "${{ inputs.tag }}" ] && git push ${FLAG} gitcode "${{ inputs.tag }}" || true

      - name: Sync cnb.cool
        continue-on-error: true
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: |
          [ -z "${CNB_TOKEN}" ] && { echo "无 CNB_TOKEN，跳过"; exit 0; }
          FLAG=""; [ "${{ inputs.force }}" = "true" ] && FLAG="--force"
          git remote add cnb "https://oauth2:${CNB_TOKEN}@cnb.cool/NextLNMP/NextLNMP.git"
          git push ${FLAG} cnb HEAD:main
          [ -n "${{ inputs.tag }}" ] && git push cnb "${{ inputs.tag }}" || true
