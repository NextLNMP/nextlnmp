name: Check Mirror Coverage

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'  # 每周一 03:17 UTC

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: HEAD-check every file the installer can request
        run: bash tools/check-mirror-coverage.sh

      - name: HEAD-check ModelScope backup mirror
        continue-on-error: true  # 副镜像滞后只警告，不判红
        run: bash tools/check-mirror-coverage.sh "https://modelscope.cn/datasets/iLang/NextLNMP-dist/resolve/master"
