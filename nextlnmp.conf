Download_Mirror='https://mirror.nextlnmp.cn'
# 备用镜像（魔搭 ModelScope 数据集副镜像，目录结构与主镜像一致）：主镜像探活失败时自动切换
Download_Mirror_Backup='https://modelscope.cn/datasets/iLang/NextLNMP-dist/resolve/master'

Nginx_Modules_Options=''
PHP_Modules_Options=''

##Web Server Selection##
WebServer='nginx'  #可选值: nginx, caddy

##MySQL/MariaDB database directory##
MySQL_Data_Dir='/usr/local/mysql/var'
MariaDB_Data_Dir='/usr/local/mariadb/var'
##Default website home directory##
Default_Website_Dir='/home/wwwroot/default'

Enable_Nginx_Openssl='y'
Enable_Nginx_Lua='n'
Enable_Ngx_FancyIndex='n'
Enable_Swap='y'
Enable_PHP_Exif='n'
Enable_PHP_Fileinfo='n'
Enable_PHP_Ldap='n'
Enable_PHP_Bz2='n'
Enable_PHP_Sodium='n'
Enable_PHP_Imap='n'
